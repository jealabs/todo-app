<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header class="bg-blue-600 text-white p-5 text-2xl font-bold text-center">
      Todo App
    </header>

    <main class="p-10 flex justify-center items-center">
      <div class="flex flex-col gap-4">
        <form
          id="todo-form"
          class="flex flex-col bg-blue-600 w-[500px] gap-4 p-5 rounded-xl"
        >
          <input
            id="todo-input"
            class="p-2 rounded-md outline-none text-white bg-blue-700 focus:bg-blue-800 placeholder:text-white"
            type="text"
            placeholder="Add a new todo"
          />
          <button
            id="todo-button-add"
            class="bg-white hover:bg-blue-100 transition-all duration-300 cursor-pointer active:scale-95 text-blue-600 p-2 rounded-md font-bold"
            type="submit"
          >
            Add
          </button>

          <div class="flex justify-evenly text-white">
            <button id="all">All</button>
            <button id="active">Active</button>
            <button id="completed">Completed</button>
          </div>
        </form>

        <ul
          id="todo-list"
          class="flex flex-col justify-between gap-4 bg-blue-700 text-white p-2 rounded-md"
        ></ul>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
