<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <header class="bg-blue-600 text-white p-5 text-2xl font-bold text-center">
      Todo App
    </header>

    <main class="p-10 flex justify-center items-center">
      <form class="flex flex-col bg-blue-600 w-[500px] gap-4 p-5 rounded-xl">
        <input
          class="p-2 rounded-md outline-none text-white bg-blue-700 focus:bg-blue-800 placeholder:text-white"
          type="text"
          placeholder="Add a new todo"
        />
        <button
          class="bg-white hover:bg-blue-100 transition-all duration-300 cursor-pointer active:scale-95 text-blue-600 p-2 rounded-md font-bold"
          type="submit"
        >
          Add
        </button>

        <ul class="flex flex-col gap-2 bg-blue-700 text-white p-2 rounded-md">
          <li class="flex items-center gap-2 p-2 rounded-md">
            <input class="w-4 h-4" type="checkbox" />
            <span class="ml-2">Todo 1</span>
            <button
              class="ml-auto hover:text-red-500 transition-all duration-300 cursor-pointer"
            >
              Delete
            </button>
          </li>
        </ul>
      </form>
    </main>
  </body>
</html>
